name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1' # every Monday 08:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the TestNG suite in headless Chrome
        run: mvn -B test -Dheadless=true

      - name: Upload test reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/screenshots/
          retention-days: 14
